# Personal Codex defaults. Authentication, history, and runtime databases
# intentionally stay outside this repository.
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
notify = ["notify-turn-end.sh"]
service_tier = "default"
model = "gpt-6-astra"

[features]
hooks = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 2

[agents.designer]
description = "UI/UX とデザインシステムの達成条件を定義する。"
config_file = "agents/designer.toml"

[agents.ui_checker]
description = "UI を実測し、証拠付きで達成条件を検証する。"
config_file = "agents/ui-checker.toml"

[mcp_servers.obscura]
command = "obscura"
args = ["mcp"]
required = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[tui]
# Completion and approval notifications use emit-turn-end.sh so MOCA_URL
# stays the one notification path without duplicate TUI BELs.
notifications = false
status_line = ["model-with-reasoning", "current-dir"]
status_line_use_colors = true

[sandbox_workspace_write]
network_access = false

[features.context_management]
experimental_mode = true
