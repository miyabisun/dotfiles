# Personal Codex defaults. Authentication, history, and runtime databases
# intentionally stay outside this repository.
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "live"
notify = ["notify-turn-end.sh"]
service_tier = "default"

[features]
hooks = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 2

[agents.designer]
description = "UI/UX とデザインシステムの達成条件を定義する。"
config_file = "agents/designer.toml"

[agents.ui_checker]
description = "UI を実測し、証拠付きで達成条件を検証する。"
config_file = "agents/ui-checker.toml"

[mcp_servers.obscura]
command = "obscura"
args = ["mcp"]
required = false

# agent-talk broker (v0.11.0+, herdr-only)。daemon が接続元から pane を特定する
# ため forward は Linux では必須ではないが、非標準 runtime root・named
# session・macOS では要るので残している (残置は無害)
#
# adapter は v0.8.0 から release tarball に同梱され、daemon と同じ release に
# 並ぶ。`current` は update.timer の atomic swap で版が進む安定パスなので、
# ここを指すことで daemon と adapter の版が常に揃う。PATH 解決や
# `~/.local/bin` の複製に戻すと version skew が復活する。MCP の command は
# shell の command line ではないため `~` や `$HOME` は展開されない。
[mcp_servers.agent_talk]
# Codex は MCP command を shell 非経由で spawn し ~/$HOME を展開しない。
# sh が $HOME だけを展開し、exec で release 実体へ置き換わる (PATH 探索なし)
command = "sh"
args = ["-c", "exec \"$HOME/.local/share/agent-talk/current/agent-talk-mcp\""]
env_vars = ["HERDR_PANE_ID", "HERDR_SOCKET_PATH", "XDG_RUNTIME_DIR"]
required = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[tui]
# Completion and approval notifications use emit-turn-end.sh so MOCA_URL
# stays the one notification path without duplicate TUI BELs.
notifications = false

[sandbox_workspace_write]
network_access = false
