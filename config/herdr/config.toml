onboarding = false
# herdr 設定 (dotfiles 管理; bin/install が ~/.config/herdr/config.toml へ
# ファイル単位で symlink する。~/.config/herdr 自体は herdr ランタイムの
# 実ディレクトリ (sock/log/session) なので dir 単位では張らない)
#
# 方針 (user 指示): herdr 既定のショートカットをそのまま使い、override は
# 最小限に留める。tmux・mux・a() は不変。
# 参考: split_vertical=prefix+v / new_cwd=follow は herdr 既定のため設定不要。
# prefix 二度押し (tmux の C-b C-b の指癖) は herdr がリテラル prefix 送出に
# 予約しており割当不可。

[keys]
# 下 (上下) 分割は既定の prefix+minus ではなく tmux と同じ prefix+s
split_horizontal = "prefix+s"

# option+hjkl navigation: タブは左右 (h/l)、space は上下 (j/k)。
# alt 層は readline/vim とほぼ衝突しない更地 (iTerm2 は Option=Esc+ 設定済み、
# WT は native)。herdr 既定の prefix+p/n は array で温存する
previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+l"]
next_workspace = "alt+j"
previous_workspace = "alt+k"

# pen — herdr workspace の仮死トグル (miyabi-sunny-side/pen-cli)
# alt+s: 現在の workspace を TOML へ保存
[[keys.command]]
key = "alt+s"
type = "shell"
command = "pen save"

# alt+x: 現在の workspace を削除 (TOML 未保存なら「先にセーブするか?」の確認)
[[keys.command]]
key = "alt+x"
type = "popup"
command = "pen close"
width = "50%"
height = "40%"

# prefix+space: 保存 TOML + 生存 workspace の統合 picker
# (ctrl+b 二連打は herdr がリテラル prefix 送出に予約しており割当不可)
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "pen picker"
width = "90%"
height = "90%"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false
