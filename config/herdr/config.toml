onboarding = false
# herdr 設定 (dotfiles 管理; bin/install が ~/.config/herdr/config.toml へ
# ファイル単位で symlink する。~/.config/herdr 自体は herdr ランタイムの
# 実ディレクトリ (sock/log/session) なので dir 単位では張らない)
#
# 方針: herdr は agent の指示・task・workspace の ON-OFF。
# tmux / mux は agent を置かないローカル作業場。指癖だけ共有する
# (alt+hjkl / alt+s / alt+x / prefix+space)。tmux 側の実体は tmux-mux。
# a() は生存 session への attach helper のまま。
# 参考: split_vertical=prefix+v / new_cwd=follow は herdr 既定のため設定不要。
# prefix 二度押し (tmux の C-b C-b の指癖) は herdr がリテラル prefix 送出に
# 予約しており割当不可。

[keys]
# 下 (上下) 分割は既定の prefix+minus ではなく tmux と同じ prefix+s
split_horizontal = "prefix+s"

# split_horizontal=prefix+s が settings の既定キーを shadow するため、
# iTerm の Cmd+, の指癖に合わせて prefix+comma へ明示移設する
settings = "prefix+comma"

# hjkl は2層: alt+hjkl = 移動 (直接・連打向き)、prefix+ctrl+hjkl = 交換
# (tmux 時代の並び替え層。下の [[keys.command]] herdr-swap を参照)。
# タブは左右 (h/l)、workspace は上下 (j/k)。
# alt 層は readline/vim とほぼ衝突しない更地 (iTerm2 は Option=Esc+ 設定済み、
# WT は native)。herdr 既定の prefix+p/n は array で温存する
previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+l"]
next_workspace = ["alt+j"]
previous_workspace = ["alt+k"]

# 交換層: prefix+ctrl+hjkl で focused tab / workspace を隣と入れ替える。
# herdr に組込みの並び替え key action が無いため、socket API の
# tab.move / workspace.move を叩く herdr-swap (config/herdr/bin) を bind する。
# 端では wrap せず no-op。
[[keys.command]]
key = "prefix+ctrl+h"
type = "shell"
command = "herdr-swap tab previous"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "herdr-swap tab next"

[[keys.command]]
key = "prefix+ctrl+j"
type = "shell"
command = "herdr-swap workspace next"

[[keys.command]]
key = "prefix+ctrl+k"
type = "shell"
command = "herdr-swap workspace previous"

# pen — herdr workspace の仮死トグル (miyabi-sunny-side/pen-cli)
# alt+s: 現在の workspace を TOML へ保存
[[keys.command]]
key = "alt+s"
type = "shell"
command = "pen save"

# alt+x: 現在の workspace を削除 (TOML 未保存なら「先にセーブするか?」の確認)
[[keys.command]]
key = "alt+x"
type = "popup"
command = "pen close"
width = "50%"
height = "40%"

# prefix+space: 保存 TOML + 生存 workspace の統合 picker
# (ctrl+b 二連打は herdr がリテラル prefix 送出に予約しており割当不可)
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "pen picker"
width = "90%"
height = "90%"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false
